<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walney — terrain blockout</title>
<meta name="description" content="Real LiDAR terrain of north Walney, the Duddon estuary and Black Combe, for placing camera views before shading.">
<script type="importmap">{"imports":{"three":"../vendor/three.webgpu.js","three/webgpu":"../vendor/three.webgpu.js","three/tsl":"../vendor/three.tsl.js"}}</script>
<style>
 :root{--panel:#141a1d;--ink:#dfe6e3;--dim:#8d9a98;--accent:#e9a23b;--line:#2b3438}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:#0d1214;color:var(--ink);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
 #app{display:grid;grid-template-columns:340px 1fr;height:100%}
 aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
 #map{width:100%;flex:1;min-height:200px;cursor:crosshair;display:block;touch-action:none}
 .controls{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px;overflow:auto;max-height:52%}
 .row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px}
 .row output{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
 input[type=range]{width:100%;accent-color:var(--accent)}
 select,button{background:#222b2f;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
 button:hover,select:hover{border-color:var(--accent)}
 .buttons{display:flex;flex-wrap:wrap;gap:6px}
 h1{font-size:14px;margin:0;padding:10px 12px 4px}
 .hint{color:var(--dim);padding:0 12px 8px;margin:0}
 #view{position:relative;min-width:0}
 #view canvas{display:block;width:100%;height:100%}
 #readout{position:absolute;left:12px;bottom:10px;color:#fff;text-shadow:0 1px 3px #000a;font-variant-numeric:tabular-nums;pointer-events:none}
 #credit{position:absolute;right:10px;bottom:8px;color:#ffffffaa;font-size:11px;text-shadow:0 1px 2px #000;max-width:60%;text-align:right}
 #status{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
 @media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:45% 55%}aside{order:2}}
</style></head>
<body><div id="app">
<aside>
 <h1>Walney blockout</h1>
 <p class="hint">Click the map to place the camera, drag from it to aim. Wheel zooms the map, right-drag pans. Drag the 3D view to look around.</p>
 <canvas id="map"></canvas>
 <div class="controls">
  <div class="row"><label for="preset">View</label><select id="preset" style="grid-column:span 2"></select></div>
  <div class="row"><label for="eye">Eye height m</label><input id="eye" type="range" min="0.5" max="300" step="0.5"><output id="eye-v"></output></div>
  <div class="row"><label for="heading">Heading °</label><input id="heading" type="range" min="0" max="360" step="0.5"><output id="heading-v"></output></div>
  <div class="row"><label for="pitch">Pitch °</label><input id="pitch" type="range" min="-45" max="30" step="0.25"><output id="pitch-v"></output></div>
  <div class="row"><label for="fov">Lens mm</label><input id="fov" type="range" min="14" max="200" step="1"><output id="fov-v"></output></div>
  <div class="row"><label for="tide">Tide m ODN</label><input id="tide" type="range" min="-4.5" max="5" step="0.1"><output id="tide-v"></output></div>
  <div class="row"><label for="haze">Haze</label><input id="haze" type="range" min="0" max="10" step="0.05"><output id="haze-v"></output></div>
  <div class="row"><label for="overcast">Overcast</label><input id="overcast" type="range" min="0" max="1" step="0.01"><output id="overcast-v"></output></div>
  <div class="row"><label for="clouds">Cumulus</label><input id="clouds" type="range" min="0" max="1" step="0.01"><output id="clouds-v"></output></div>
  <div class="row"><label for="wind">Wind m/s</label><input id="wind" type="range" min="0" max="20" step="0.5"><output id="wind-v"></output></div>
  <div class="row"><label for="swell">Swell</label><input id="swell" type="range" min="0" max="3" step="0.05"><output id="swell-v"></output></div>
  <div class="row"><label for="exposure">Exposure</label><input id="exposure" type="range" min="0.2" max="3" step="0.01"><output id="exposure-v"></output></div>
  <div class="row"><label for="sunaz">Sun azimuth</label><input id="sunaz" type="range" min="0" max="360" step="1"><output id="sunaz-v"></output></div>
  <div class="row"><label for="sunel">Sun elevation</label><input id="sunel" type="range" min="-6" max="62" step="0.25"><output id="sunel-v"></output></div>
  <div class="row"><label for="motion">Motion</label><select id="motion" style="grid-column:span 2"><option value="locked">Locked off</option><option value="sway">Slow pan, left and right</option><option value="right">Drift right</option><option value="left">Drift left</option></select></div>
  <div class="row"><label for="panDeg">Pan swing °</label><input id="panDeg" type="range" min="2" max="90" step="1"><output id="panDeg-v"></output></div>
  <div class="row"><label for="panSecs">Pan time s</label><input id="panSecs" type="range" min="10" max="240" step="5"><output id="panSecs-v"></output></div>
  <div class="row"><label for="tint">Look</label><select id="tint" style="grid-column:span 2"><option value="0">Clay</option><option value="1">Tinted</option></select></div>
  <div class="buttons"><button id="save">Save view</button><button id="copy">Copy camera JSON</button><button id="download">Download cameras</button></div>
 </div>
</aside>
<main id="view"><div id="status">Loading terrain…</div><div id="readout"></div><div id="credit"></div></main>
</div>
<script type="module" src="./main.js"></script>
</body></html>
